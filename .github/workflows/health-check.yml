name: Health Check

on:
  schedule:
    # Runs every 15 minutes. Adjust as needed (cron is UTC).
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # allows manual triggering from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run health check
        id: check
        run: |
          URL="${{ vars.HEALTH_CHECK_URL }}"

          if [ -z "$URL" ]; then
            echo "::error::HEALTH_CHECK_URL repository variable is not set"
            exit 1
          fi

          START=$(date +%s%3N)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          END=$(date +%s%3N)
          LATENCY=$((END - START))

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            STATUS="up"
          else
            STATUS="down"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "http_status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          echo "latency=$LATENCY" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

          echo "Checked $URL -> $HTTP_STATUS ($STATUS) in ${LATENCY}ms"

      - name: Record result
        run: |
          mkdir -p docs
          FILE=docs/data.json
          if [ ! -f "$FILE" ]; then echo "[]" > "$FILE"; fi

          jq --arg ts "${{ steps.check.outputs.timestamp }}" \
             --arg status "${{ steps.check.outputs.status }}" \
             --argjson httpStatus "${{ steps.check.outputs.http_status }}" \
             --argjson latencyMs "${{ steps.check.outputs.latency }}" \
             '. + [{timestamp:$ts, status:$status, httpStatus:$httpStatus, latencyMs:$latencyMs}] | .[-200:]' \
             "$FILE" > tmp.json && mv tmp.json "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record health check result [skip ci]"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi

      # Opens/updates a GitHub issue when the endpoint is down,
      # so failures are visible without needing to watch Actions runs.
      - name: Open issue on failure
        if: steps.check.outputs.status == 'down'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Health check failed';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check'
            });

            const existing = issues.find(issue => issue.title === title);
            const body = `The scheduled health check returned a non-2xx response.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['health-check']
              });
            }

      - name: Mark run as failed
        if: steps.check.outputs.status == 'down'
        run: exit 1