<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Service Status</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 2rem;
        line-height: 1.5;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      h1 {
        margin-top: 0;
      }

      .status-card {
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        padding: 1rem;
      }

      .status-label {
        display: inline-block;
        border-radius: 999px;
        padding: 0.25rem 0.75rem;
        font-weight: 600;
        border: 1px solid currentColor;
        background: transparent;
      }

      .incident-message {
        margin-bottom: 0;
      }

      .status-note {
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>API Service Status</h1>
      <section class="status-card" aria-label="Current API service status" data-service="api">
        <p>
          <strong>Current status:</strong>
          <span class="status-label" data-status="operational">Operational</span>
        </p>
        <p class="incident-message">No active incidents reported.</p>
        <p class="status-note">Update this page manually if service status changes.</p>
      </section>
    </main>
  </body>
</html>
